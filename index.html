<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge & Convert to PDF</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%231e293b'/%3E%3Crect%20x='19'%20y='11'%20width='28'%20height='36'%20rx='3'%20fill='%2364748b'/%3E%3Cpath%20d='M15%2017h22l9%209v28a3%203%200%200%201-3%203H15a3%203%200%200%201-3-3V20a3%203%200%200%201%203-3z'%20fill='%23ffffff'/%3E%3Cpath%20d='M37%2017v6a3%203%200%200%200%203%203h6z'%20fill='%23e2e8f0'/%3E%3Crect%20x='18'%20y='38'%20width='22'%20height='10'%20rx='2'%20fill='%232563eb'/%3E%3Crect%20x='18'%20y='31'%20width='14'%20height='3'%20rx='1.5'%20fill='%2364748b'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --ink: #1e293b;
    --ink2: #64748b;
    --accent: #2563eb;
    --accent2: #eff6ff;
    --border: #e2e8f0;
    --danger: #dc2626;
  }

  body {
    background: linear-gradient(135deg, #f8fafc, #eff6ff) fixed;
    color: var(--ink);
    font-family: 'Gowun Dodum', serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px 80px;
  }

  .wrap {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 4px 0 8px;
    border-bottom: 2px solid var(--ink);
  }

  header h1 {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    letter-spacing: -0.5px;
  }

  header span {
    font-size: 12px;
    color: var(--ink2);
    font-family: 'DM Mono', monospace;
  }

  /* drop zone */
  #drop-zone {
    background: var(--card);
    border: 1.5px dashed #cbd5e1;
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    user-select: none;
  }
  #drop-zone.dragover {
    border-color: var(--accent);
    background: var(--accent2);
  }

  #drop-zone .icon {
    font-size: 32px;
    margin-bottom: 10px;
    display: block;
  }

  #drop-zone p {
    font-size: 14px;
    color: var(--ink2);
    line-height: 1.6;
  }

  #drop-zone strong { color: var(--ink); }

  /* preview grid */
  #preview {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .thumb-wrap {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    cursor: grab;
    aspect-ratio: 3/4;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    transition: box-shadow .15s;
  }
  .thumb-wrap:active { cursor: grabbing; box-shadow: 0 4px 12px rgba(0,0,0,.15); }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  .thumb-pdf {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: var(--accent2);
    color: #1e40af;
    padding: 6px;
    text-align: center;
    pointer-events: none;
  }
  .thumb-pdf .icon { font-size: 22px; }
  .thumb-pdf small {
    font-size: 9px;
    line-height: 1.2;
    max-height: 28px;
    overflow: hidden;
    word-break: break-all;
  }

  .thumb-range {
    position: absolute;
    left: 4px; right: 4px; bottom: 4px;
    display: none;
    gap: 4px;
    align-items: center;
    background: rgba(255,255,255,.94);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 4px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--ink2);
    cursor: default;
  }
  .thumb-range.ready { display: flex; }
  .thumb-range input {
    flex: 1; min-width: 0; width: 100%;
    border: none; outline: none; background: transparent;
    font: inherit; color: var(--ink);
  }
  .thumb-range.bad { border-color: var(--danger); }
  .thumb-range.bad input { color: var(--danger); }

  .thumb-num {
    position: absolute;
    top: 4px;
    left: 5px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    background: rgba(0,0,0,.55);
    color: #fff;
    border-radius: 4px;
    padding: 1px 4px;
    pointer-events: none;
  }

  .thumb-del {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    background: rgba(220,38,38,.8);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 12px;
    line-height: 20px;
    text-align: center;
    cursor: pointer;
    display: none;
    padding: 0;
  }
  .thumb-wrap:hover .thumb-del { display: block; }

  /* controls */
  .controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field label {
    display: block;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--ink2);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--accent); }

  .row { display: flex; gap: 8px; }

  .btn {
    flex: 1;
    padding: 10px 8px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-family: 'Gowun Dodum', serif;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    transition: background .12s, border-color .12s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg); border-color: #94a3b8; }
  .btn:active { background: #e2e8f0; }

  .btn-primary {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
    font-size: 14px;
    padding: 12px;
  }
  .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
  .btn-primary:disabled { background: #cbd5e1; border-color: #cbd5e1; cursor: not-allowed; }

  /* progress */
  #prog-wrap {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  #prog-label {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--ink2);
    margin-bottom: 8px;
  }

  .bar-bg {
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  #bar { height: 100%; width: 0%; background: var(--accent); border-radius: 99px; transition: width .18s ease; }

  /* count badge */
  #count-badge {
    display: none;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--ink2);
    text-align: right;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Merge & Convert to PDF</h1>
    <span id="count-badge">파일 0개</span>
  </header>

  <div id="drop-zone">
    <span class="icon">📂</span>
    <p><strong>클릭하거나 여기에 파일을 드래그</strong><br>이미지(JPG, PNG, WEBP 등) 또는 PDF 파일</p>
    <input type="file" id="file-input" multiple accept="image/*,application/pdf" style="display:none">
  </div>

  <div id="preview"></div>

  <div class="controls">
    <div class="field">
      <label>저장 파일명</label>
      <input type="text" id="fname" placeholder="파일명 (기본: 첫파일명_new_pdf)">
    </div>
    <div class="row">
      <button class="btn" onclick="sortFiles(1)">가나다순 ↑</button>
      <button class="btn" onclick="sortFiles(-1)">가나다순 ↓</button>
      <button class="btn" onclick="clearAll()">전체 삭제</button>
    </div>
    <button class="btn btn-primary" id="dl-btn" disabled onclick="makePDF()">PDF로 저장 / 병합</button>
  </div>

  <div id="prog-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div id="prog-label" style="font-family:'DM Mono',monospace;font-size:12px;color:var(--ink2)">준비 중…</div>
      <div id="prog-pct" style="font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--accent)">0%</div>
    </div>
    <div class="bar-bg"><div id="bar"></div></div>
  </div>

</div>

<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const files = []; // { id, file, objURL, thumbURL, isPDF, numPages }
let uidCounter = 0;

const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const preview    = document.getElementById('preview');
const dlBtn      = document.getElementById('dl-btn');
const progWrap   = document.getElementById('prog-wrap');
const progLabel  = document.getElementById('prog-label');
const bar        = document.getElementById('bar');
const badge      = document.getElementById('count-badge');

// 드래그 & 드롭
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => addFiles(e.target.files));

// 파일 추가
function addFiles(list) {
  for (const f of list) {
    const isPDF = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    if (!f.type.startsWith('image/') && !isPDF) continue;

    const id  = uidCounter++;
    const url = isPDF ? null : URL.createObjectURL(f);
    const entry = { id, file: f, objURL: url, thumbURL: null, isPDF };
    files.push(entry);

    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    wrap.dataset.id = id;

    if (isPDF) {
      // 렌더링 전까지 보여줄 임시 아이콘
      const ph = document.createElement('div');
      ph.className = 'thumb-pdf';
      ph.innerHTML = `<span class="icon">📄</span><small>${f.name}</small>`;
      wrap.appendChild(ph);

      // 첫 페이지를 실제 썸네일로 비동기 렌더링
      renderPdfThumbnail(f).then(({ url: thumbURL, numPages }) => {
        entry.thumbURL = thumbURL;
        entry.numPages = numPages;
        const cur = preview.querySelector(`.thumb-wrap[data-id="${id}"]`);
        if (!cur) return; // 렌더링 중 삭제된 경우
        const img = document.createElement('img');
        img.src = thumbURL;
        img.loading = 'lazy';
        img.decoding = 'async';
        cur.querySelector('.thumb-pdf')?.replaceWith(img);
        addRangeBox(cur, numPages);
      }).catch(() => {
        // 렌더링 실패 시 아이콘 그대로 유지 (썸네일만 못 뜰 뿐, 병합엔 영향 없음)
      });
    } else {
      const img = document.createElement('img');
      img.src = url;
      img.loading = 'lazy';
      img.decoding = 'async';
      wrap.appendChild(img);
    }

    const num = document.createElement('div');
    num.className = 'thumb-num';

    const del = document.createElement('button');
    del.className = 'thumb-del';
    del.textContent = '✕';
    del.addEventListener('click', (e) => { e.stopPropagation(); removeFile(id, wrap); });

    wrap.append(num, del);
    preview.appendChild(wrap);
  }
  updateUI();
  fileInput.value = '';
}

// PDF 첫 페이지를 캔버스에 그려서 썸네일 이미지 URL로 반환
async function renderPdfThumbnail(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const numPages = pdf.numPages;
  const page = await pdf.getPage(1);
  const baseViewport = page.getViewport({ scale: 1 });
  const scale = 320 / baseViewport.width; // 카드 크기에 맞춘 적당한 해상도
  const viewport = page.getViewport({ scale });

  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;

  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (!blob) return reject(new Error('PDF 썸네일 생성 실패'));
      pdf.destroy();
      resolve({ url: URL.createObjectURL(blob), numPages });
    }, 'image/jpeg', 0.85);
  });
}

// PDF 카드 하단에 페이지 범위 입력칸 추가 (비워두면 전체)
function addRangeBox(card, numPages) {
  const box = document.createElement('label');
  box.className = 'thumb-range ready';
  box.title = `예: 1-3, 5, 8-  (비우면 전체 ${numPages}쪽)`;
  box.innerHTML = `<input type="text" placeholder="전체" spellcheck="false" autocomplete="off"><span>/${numPages}</span>`;
  const input = box.querySelector('input');
  input.addEventListener('input', () => box.classList.toggle('bad', !parsePageRange(input.value, numPages)));
  card.appendChild(box);
}

// "1-3, 5, 8-" → 0-기반 페이지 인덱스 배열. 빈 값이면 전체, 형식이 잘못되면 null
function parsePageRange(text, total) {
  text = text.trim();
  if (!text) return Array.from({ length: total }, (_, i) => i);
  const out = [];
  for (const part of text.split(/[,\s]+/).filter(Boolean)) {
    const m = part.match(/^(\d*)(?:-(\d*))?$/);
    if (!m || (m[1] === '' && (m[2] === undefined || m[2] === ''))) return null;
    const a = m[1] === '' ? 1 : +m[1];
    const b = m[2] === undefined ? a : (m[2] === '' ? total : +m[2]);
    if (a < 1 || b > total || a > b) return null;
    for (let i = a; i <= b; i++) out.push(i - 1);
  }
  return out;
}

// 개별 삭제
function removeFile(id, el) {
  const idx = files.findIndex(f => f.id === id);
  if (idx !== -1) {
    if (files[idx].objURL) URL.revokeObjectURL(files[idx].objURL);
    if (files[idx].thumbURL) URL.revokeObjectURL(files[idx].thumbURL);
    files.splice(idx, 1);
  }
  el.remove();
  updateUI();
}

// 전체 삭제
function clearAll() {
  files.forEach(f => {
    if (f.objURL) URL.revokeObjectURL(f.objURL);
    if (f.thumbURL) URL.revokeObjectURL(f.thumbURL);
  });
  files.length = 0;
  preview.innerHTML = '';
  updateUI();
  progWrap.style.display = 'none';
}

// 가나다순 정렬 (dir: 1=오름차순, -1=내림차순)
function sortFiles(dir = 1) {
  const domItems = [...preview.children];
  domItems.sort((a, b) => {
    const fa = files.find(f => f.id == a.dataset.id).file.name;
    const fb = files.find(f => f.id == b.dataset.id).file.name;
    return fa.localeCompare(fb, 'ko', { numeric: true }) * dir;
  });
  domItems.forEach(el => preview.appendChild(el));
  updateUI();
}

// UI 상태 업데이트 (순번 갱신)
// 기본 파일명: 첫 번째 파일 이름(확장자 제외) + _new_pdf
function defaultName() {
  const first = preview.firstElementChild;
  const entry = first && files.find(f => f.id === Number(first.dataset.id));
  const base = entry ? entry.file.name.replace(/\.[^.]*$/, '') : 'converted';
  return base + '_new_pdf';
}

function updateUI() {
  const count = preview.children.length;
  dlBtn.disabled = count === 0;
  badge.style.display = count ? 'block' : 'none';
  badge.textContent = `파일 ${count}개`;
  document.getElementById('fname').placeholder = `파일명 (기본: ${defaultName()})`;
  [...preview.children].forEach((el, i) => {
    el.querySelector('.thumb-num').textContent = i + 1;
  });
}

// 드래그 순서 변경
Sortable.create(preview, {
  animation: 140,
  filter: '.thumb-range',
  preventOnFilter: false,
  ghostClass: 'sortable-ghost',
  onEnd: updateUI,
});

// 이미지 1장을 리사이즈 + JPEG 압축해서 바이트 배열로 반환 (dataURL 왕복 없이 바로 arrayBuffer 사용 → 더 빠르고 메모리 절약)
async function processImageToJpegBytes(entry) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 2048;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX || h > MAX) {
        const s = MAX / Math.max(w, h);
        w = Math.round(w * s); h = Math.round(h * s);
      }

      let canvas, ctx;
      try {
        canvas = new OffscreenCanvas(w, h);
        ctx = canvas.getContext('2d');
      } catch {
        canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        ctx = canvas.getContext('2d');
      }
      ctx.drawImage(img, 0, 0, w, h);

      const toBytes = (cvs) => new Promise((res, rej) => {
        if (cvs instanceof OffscreenCanvas) {
          cvs.convertToBlob({ type: 'image/jpeg', quality: 0.88 })
             .then(blob => blob.arrayBuffer())
             .then(buf => res(new Uint8Array(buf)))
             .catch(rej);
        } else {
          cvs.toBlob(blob => {
            if (!blob) return rej(new Error('canvas toBlob 실패'));
            blob.arrayBuffer().then(buf => res(new Uint8Array(buf))).catch(rej);
          }, 'image/jpeg', 0.88);
        }
      });

      toBytes(canvas).then(bytes => resolve({ bytes, w, h })).catch(reject);
    };
    img.onerror = reject;
    img.src = entry.objURL;
  });
}

// PDF 생성 / 병합 (이미지는 A4 페이지에 삽입, 기존 PDF는 페이지를 그대로 복사)
async function makePDF() {
  const items = [...preview.querySelectorAll('.thumb-wrap')];
  if (!items.length) return;

  const rawName = document.getElementById('fname').value.trim() || defaultName();
  const safeName = rawName.replace(/[:\\/*?"<>|]/g, '_');

  dlBtn.disabled = true;
  progWrap.style.display = 'block';

  try {
    const { PDFDocument } = PDFLib;
    const outDoc = await PDFDocument.create();
    const PW = 595.28, PH = 841.89; // A4, pt 단위

    for (let i = 0; i < items.length; i++) {
      setProgress(i, items.length);

      const id = Number(items[i].dataset.id);
      const entry = files.find(f => f.id === id);
      if (!entry) continue;

      if (entry.isPDF) {
        // 기존 PDF는 재인코딩 없이 페이지 그대로 복사 (화질 손실 없음, 빠름)
        const srcBytes = new Uint8Array(await entry.file.arrayBuffer());
        const srcDoc = await PDFDocument.load(srcBytes, { ignoreEncryption: true });
        const rangeText = items[i].querySelector('.thumb-range input')?.value ?? '';
        const idxs = parsePageRange(rangeText, srcDoc.getPageCount());
        if (!idxs) throw new Error(`${entry.file.name}: 페이지 범위가 올바르지 않습니다`);
        const copiedPages = await outDoc.copyPages(srcDoc, idxs);
        copiedPages.forEach(p => outDoc.addPage(p));
      } else {
        const { bytes, w, h } = await processImageToJpegBytes(entry);
        const jpg = await outDoc.embedJpg(bytes);
        const ratio = Math.min(PW / w, PH / h);
        const dw = w * ratio, dh = h * ratio;
        const page = outDoc.addPage([PW, PH]);
        page.drawImage(jpg, { x: (PW - dw) / 2, y: (PH - dh) / 2, width: dw, height: dh });
      }
    }

    setProgress(items.length, items.length);
    progLabel.textContent = '저장 중…';

    const pdfBytes = await outDoc.save();
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${safeName}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    progLabel.textContent = '✓ 저장 완료';
    document.getElementById('prog-pct').textContent = '100%';
  } catch (err) {
    console.error(err);
    progLabel.textContent = '오류 발생: ' + err.message;
  } finally {
    dlBtn.disabled = false;
  }
}

function setProgress(cur, total) {
  const pct = Math.round((cur / total) * 100);
  bar.style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
  progLabel.textContent = cur < total
    ? `처리 중 ${cur + 1} / ${total}`
    : '저장 중…';
}
</script>
</body>
</html>
